apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./default

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: pgo
    spec:
      template:
        spec:
          containers:
          - name: operator
            env:
            - name: PGO_FEATURE_GATES
              value: "OpenTelemetryLogs=true,OpenTelemetryMetrics=true"